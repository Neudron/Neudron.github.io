# Deploy the site to GitHub Pages.
#
# Pages source is "GitHub Actions": a push to main publishes only after
# this workflow uploads an artifact. The site is built from source into
# dist/ — the portfolio shell loads immediately, the game chunk and its
# art stay off the wire until a visitor enters the game. Only dist/ is
# uploaded; memory/, tests/, _scripts/, notes and tooling never ship.

name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # so it can be re-run by hand without a commit

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied
# deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: ES5 syntax gate
        run: npm run check

      - name: Build publishable site
        run: npm run build

      - name: Verify artifact allowlist and public surface
        run: npm run verify

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
