# Deploy the site to GitHub Pages.
#
# This repo's Pages source is set to "GitHub Actions" rather than
# "Deploy from a branch". That distinction is the whole reason this
# file has to exist: with the Actions source selected, a push to main
# does NOT publish anything on its own — GitHub waits for a workflow
# to upload an artifact. With no workflow present, every push looked
# like it succeeded and silently deployed nothing.
#
# The site is plain static files with no build step. After the merge
# that flattened site/ to root, the repo root also contains memory/
# (the complete walkthrough — the first puzzle is finding the way in),
# tests/, _scripts/, and .github/. These must never ship, so the
# workflow stages only the web-facing files before uploading.

name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # so it can be re-run by hand without a commit

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-applied
# deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage only site files
        run: |
          mkdir _stage
          cp -r index.html css js fonts img audio CNAME .nojekyll og.png _stage/ 2>/dev/null || true
          cp -r .well-known _stage/ 2>/dev/null || true

      - name: Upload staged site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_stage'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
