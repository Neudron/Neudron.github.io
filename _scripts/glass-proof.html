<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>neu — glass proof</title>
<style>
  :root{
    --void:#08080B; --ink:#14141C; --crypt:#22222E;
    --bone:#EDE7DE; --ghost:#8A8598; --lilac:#B892FF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--bone);
    font:400 13px/1.5 ui-sans-serif,"Space Grotesk",system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.dragging{cursor:grabbing}

  #hint{position:fixed;left:24px;bottom:22px;color:var(--ghost);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;pointer-events:none;z-index:3}
  #fps{position:fixed;left:24px;top:22px;color:var(--ghost);font-size:11px;
    letter-spacing:.1em;font-variant-numeric:tabular-nums;pointer-events:none;z-index:3}

  #panel{position:fixed;right:16px;top:16px;width:250px;max-height:calc(100vh - 32px);
    overflow-y:auto;background:rgba(20,20,28,.82);backdrop-filter:blur(12px);
    border:1px solid var(--crypt);border-radius:12px;padding:14px;z-index:4;
    font-size:11px;scrollbar-width:thin}
  #panel h2{margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:.18em;
    text-transform:uppercase;color:var(--ghost)}
  #panel hr{border:0;border-top:1px solid var(--crypt);margin:12px 0}
  .row{margin:0 0 9px}
  .row label{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;color:var(--ghost)}
  .row label b{font-weight:400;color:var(--bone);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:2px;-webkit-appearance:none;appearance:none;
    background:var(--crypt);border-radius:2px;outline:none;margin:4px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;
    border-radius:50%;background:var(--lilac);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;
    background:var(--lilac);cursor:pointer}
  select,button{width:100%;background:var(--void);color:var(--bone);border:1px solid var(--crypt);
    border-radius:6px;padding:6px 8px;font:inherit;font-size:11px;cursor:pointer}
  select:hover,button:hover{border-color:var(--ghost)}
  .chk{display:flex;align-items:center;gap:8px;color:var(--ghost);cursor:pointer;margin:0 0 9px}
  .chk input{accent-color:var(--lilac);cursor:pointer}
  #copy{margin-top:4px;color:var(--lilac);border-color:#3a2e52}
  #fallback{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:32px;z-index:9}
  #fallback p{max-width:34ch;color:var(--ghost);line-height:1.8}
  #fallback b{display:block;font-size:34px;color:var(--bone);letter-spacing:.02em;margin-bottom:14px;font-style:italic}
  @media (max-width:760px){#panel{display:none}}
</style>
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>
<div id="fps">— fps</div>
<div id="hint">drag to rotate · click it · R to reset</div>

<div id="fallback"><p><b>neu</b>Your browser could not start WebGL, so the glass is not available here.</p></div>

<aside id="panel">
  <h2>glass</h2>
  <div class="row"><label>ior <b id="v-ior">1.62</b></label><input type="range" id="ior" min="1" max="2.333" step="0.01" value="1.62"></div>
  <div class="row"><label>thickness <b id="v-thickness">1.80</b></label><input type="range" id="thickness" min="0" max="6" step="0.05" value="1.8"></div>
  <div class="row"><label>dispersion <b id="v-dispersion">0.60</b></label><input type="range" id="dispersion" min="0" max="2" step="0.02" value="0.6"></div>
  <div class="row"><label>roughness <b id="v-roughness">0.05</b></label><input type="range" id="roughness" min="0" max="0.6" step="0.01" value="0.05"></div>
  <div class="row"><label>clearcoat <b id="v-clearcoat">1.00</b></label><input type="range" id="clearcoat" min="0" max="1" step="0.02" value="1"></div>
  <div class="row"><label>tint darkness <b id="v-tint">0.06</b></label><input type="range" id="tint" min="0" max="0.5" step="0.005" value="0.06"></div>

  <hr>
  <h2>light</h2>
  <div class="row"><label>env intensity <b id="v-env">0.35</b></label><input type="range" id="env" min="0" max="2" step="0.01" value="0.35"></div>
  <div class="row"><label>env rotation <b id="v-envrot">0.00</b></label><input type="range" id="envrot" min="0" max="6.28" step="0.01" value="0"></div>
  <div class="row"><label>exposure <b id="v-exposure">1.00</b></label><input type="range" id="exposure" min="0.2" max="2.5" step="0.02" value="1"></div>
  <div class="row"><label>backdrop glow <b id="v-glow">0.55</b></label><input type="range" id="glow" min="0" max="1" step="0.01" value="0.55"></div>

  <hr>
  <h2>form</h2>
  <div class="row"><label>shell</label><select id="shell">
    <option value="box">rounded box</option>
    <option value="sphere">sphere</option>
    <option value="puck">puck</option>
  </select></div>
  <div class="row"><label>letterforms</label><select id="font">
    <option value="palatino">palatino italic</option>
    <option value="bookman">bookman light italic</option>
    <option value="chancery">chancery italic</option>
  </select></div>
  <div class="row"><label>mark depth <b id="v-depth">0.18</b></label><input type="range" id="depth" min="0.02" max="0.6" step="0.01" value="0.18"></div>
  <label class="chk"><input type="checkbox" id="etch" checked> surface etch</label>
  <label class="chk"><input type="checkbox" id="spin"> idle drift</label>

  <button id="copy">copy settings</button>
</aside>

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('c');

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
} catch (e) {
  document.getElementById('fallback').style.display = 'grid';
  document.getElementById('panel').style.display = 'none';
  throw e;
}

renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x08080b, 1);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(0, 0, 7.4);

/* ── environment ──────────────────────────────────────────────────
   Transmission renders what is BEHIND the object. With no environment
   there is nothing to refract and the glass reads as grey plastic.
   RoomEnvironment is generated in code — no HDR download — and
   environmentIntensity dims the studio down to something funereal. */
const pmrem = new THREE.PMREMGenerator(renderer);
const roomEnv = new RoomEnvironment();
scene.environment = pmrem.fromScene(roomEnv, 0.04).texture;
scene.environmentIntensity = 0.35;
roomEnv.dispose();

/* ── backdrop ─────────────────────────────────────────────────────
   Something for the glass to bend. A soft off-centre glow on near
   black: reads as atmosphere, and gives the refraction real content. */
const glowCanvas = document.createElement('canvas');
glowCanvas.width = glowCanvas.height = 512;
const gctx = glowCanvas.getContext('2d');
let glowAmount = 0.55;

function paintBackdrop() {
  gctx.fillStyle = '#08080b';
  gctx.fillRect(0, 0, 512, 512);
  const g = gctx.createRadialGradient(300, 200, 10, 300, 200, 330);
  g.addColorStop(0,    `rgba(184,146,255,${0.42 * glowAmount})`);
  g.addColorStop(0.42, `rgba(90,64,140,${0.16 * glowAmount})`);
  g.addColorStop(1,    'rgba(8,8,11,0)');
  gctx.fillStyle = g;
  gctx.fillRect(0, 0, 512, 512);
  const g2 = gctx.createRadialGradient(150, 400, 5, 150, 400, 200);
  g2.addColorStop(0,   `rgba(140,47,74,${0.30 * glowAmount})`);
  g2.addColorStop(1,   'rgba(8,8,11,0)');
  gctx.fillStyle = g2;
  gctx.fillRect(0, 0, 512, 512);
  backdropTex.needsUpdate = true;
}
const backdropTex = new THREE.CanvasTexture(glowCanvas);
backdropTex.colorSpace = THREE.SRGBColorSpace;
paintBackdrop();

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(26, 26),
  new THREE.MeshBasicMaterial({ map: backdropTex })
);
backdrop.position.z = -7;
scene.add(backdrop);

/* ── the etch map ─────────────────────────────────────────────────
   Real etched glass is rougher where it was blasted. roughnessMap
   multiplies material.roughness, so a bright mark on a dark field
   frosts the letters and leaves the rest near-mirror. */
const etchCanvas = document.createElement('canvas');
etchCanvas.width = etchCanvas.height = 1024;
const ectx = etchCanvas.getContext('2d');
ectx.fillStyle = '#0c0c0c';
ectx.fillRect(0, 0, 1024, 1024);
ectx.fillStyle = '#ffffff';
ectx.font = 'italic 300 190px Palatino, "Palatino Linotype", Georgia, serif';
ectx.textAlign = 'center';
ectx.textBaseline = 'middle';
ectx.fillText('neu', 512, 512);
const etchTex = new THREE.CanvasTexture(etchCanvas);

/* ── the object ───────────────────────────────────────────────────
   Exactly ONE transmissive mesh in the scene. Each one forces a full
   extra scene render per frame to compute its refracted background. */
const glass = new THREE.MeshPhysicalMaterial({
  transmission: 1,
  thickness: 1.8,
  ior: 1.62,
  roughness: 0.05,
  dispersion: 0.6,
  color: new THREE.Color(0.06, 0.06, 0.075),
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  opacity: 1,
  transparent: false,
  roughnessMap: etchTex
});

const markMat = new THREE.MeshStandardMaterial({
  color: 0x0a0a10, roughness: 0.34, metalness: 0.1
});

const root  = new THREE.Group();
const inner = new THREE.Group();
scene.add(root);
root.add(inner);

let shellMesh = null, markMesh = null;

const SHELLS = {
  box:    () => new RoundedBoxGeometry(2.15, 2.15, 2.15, 8, 0.52),
  sphere: () => new THREE.SphereGeometry(1.28, 96, 64),
  puck:   () => new RoundedBoxGeometry(2.5, 2.5, 1.15, 8, 0.5)
};

function buildShell(kind) {
  if (shellMesh) { shellMesh.geometry.dispose(); root.remove(shellMesh); }
  shellMesh = new THREE.Mesh(SHELLS[kind](), glass);
  shellMesh.renderOrder = 1;
  root.add(shellMesh);
}

const svgLoader = new SVGLoader();

function buildMark(fontKey, depth) {
  if (markMesh) { markMesh.geometry.dispose(); inner.remove(markMesh); }

  const doc = svgLoader.parse(
    `<svg xmlns="http://www.w3.org/2000/svg"><path d="${PATHS[fontKey]}"/></svg>`
  );
  let shapes = [];
  for (const p of doc.paths) shapes = shapes.concat(p.toShapes(true));

  const geo = new THREE.ExtrudeGeometry(shapes, {
    depth,
    curveSegments: 6,
    bevelEnabled: true,
    bevelThickness: depth * 0.07,
    bevelSize: 0.009,
    bevelSegments: 3
  });
  geo.center();
  geo.computeBoundingBox();

  const w = geo.boundingBox.max.x - geo.boundingBox.min.x;
  geo.scale(1.18 / w, 1.18 / w, 1);   // normalise across fonts

  markMesh = new THREE.Mesh(geo, markMat);
  inner.add(markMesh);
}

buildShell('box');
buildMark('palatino', 0.18);

/* ── interaction ──────────────────────────────────────────────────
   Not OrbitControls. A drag with friction, then an underdamped spring
   home — so it always returns to dead-front and can never end up
   facing away, and the overshoot is where the "cute" lives. */
let spinY = 0, spinX = 0, velY = 0, velX = 0;
let dragging = false, dragged = false, lastX = 0, lastY = 0;
let leanX = 0, leanY = 0, leanTX = 0, leanTY = 0;
let squash = 0, idleDrift = false;

const K = 60, C = 9;   // damping ratio ~0.58 → settles with one soft overshoot

canvas.addEventListener('pointerdown', e => {
  dragging = true; dragged = false;
  lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture?.(e.pointerId);
});

canvas.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  leanTX = ((e.clientY - r.top) / r.height * 2 - 1) * 0.05;
  leanTY = ((e.clientX - r.left) / r.width * 2 - 1) * 0.05;
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true;
  velY += dx * 0.020;
  velX += dy * 0.014;
  lastX = e.clientX; lastY = e.clientY;
});

function endDrag(){ dragging = false; canvas.classList.remove('dragging'); }
canvas.addEventListener('pointerup', e => {
  if (!dragged) squash = 1;
  endDrag();
});
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => { endDrag(); leanTX = leanTY = 0; });

addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { spinY = spinX = velY = velX = 0; }
});

/* ── panel ────────────────────────────────────────────────────────*/
const cfg = {
  ior:1.62, thickness:1.8, dispersion:0.6, roughness:0.05, clearcoat:1,
  tint:0.06, env:0.35, envrot:0, exposure:1, glow:0.55, depth:0.18,
  shell:'box', font:'palatino', etch:true
};
const $ = id => document.getElementById(id);
const show = (id, v, d = 2) => { const el = $('v-' + id); if (el) el.textContent = (+v).toFixed(d); };

function apply(key, raw) {
  const v = parseFloat(raw);
  cfg[key] = isNaN(v) ? raw : v;
  switch (key) {
    case 'ior':        glass.ior = v;                    show(key, v); break;
    case 'thickness':  glass.thickness = v;              show(key, v); break;
    case 'dispersion': glass.dispersion = v;             show(key, v); break;
    case 'roughness':  glass.roughness = v;              show(key, v); break;
    case 'clearcoat':  glass.clearcoat = v;              show(key, v); break;
    case 'tint':       glass.color.setRGB(v, v, v * 1.22); show(key, v, 3); break;
    case 'env':        scene.environmentIntensity = v;   show(key, v); break;
    case 'envrot':     scene.environmentRotation.y = v;  show(key, v); break;
    case 'exposure':   renderer.toneMappingExposure = v; show(key, v); break;
    case 'glow':       glowAmount = v; paintBackdrop();  show(key, v); break;
    case 'depth':      buildMark(cfg.font, v);           show(key, v); break;
  }
}

['ior','thickness','dispersion','roughness','clearcoat','tint',
 'env','envrot','exposure','glow','depth'].forEach(id => {
  $(id).addEventListener('input', e => apply(id, e.target.value));
});

$('shell').addEventListener('change', e => { cfg.shell = e.target.value; buildShell(e.target.value); });
$('font').addEventListener('change',  e => { cfg.font  = e.target.value; buildMark(e.target.value, cfg.depth); });
$('etch').addEventListener('change',  e => {
  cfg.etch = e.target.checked;
  glass.roughnessMap = e.target.checked ? etchTex : null;
  glass.needsUpdate = true;
});
$('spin').addEventListener('change', e => { idleDrift = e.target.checked; });
$('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(JSON.stringify(cfg, null, 2));
    $('copy').textContent = 'copied';
    setTimeout(() => { $('copy').textContent = 'copy settings'; }, 1400);
  } catch { $('copy').textContent = 'clipboard blocked'; }
});

/* ── size ─────────────────────────────────────────────────────────*/
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < 720 ? 42 : 32;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize, { passive:true });
resize();

/* ── loop ─────────────────────────────────────────────────────────*/
let visible = true;
document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

const clock = new THREE.Clock();
let fpsAcc = 0, fpsFrames = 0;
const fpsEl = $('fps');

function tick() {
  requestAnimationFrame(tick);
  if (!visible) return;

  const dt = Math.min(clock.getDelta(), 1 / 30);

  if (reduce) {
    root.rotation.set(0, 0, 0);
  } else {
    if (dragging) {
      velY *= 0.86; velX *= 0.86;
    } else {
      velY += (-K * spinY - C * velY) * dt;   // spring home, with overshoot
      velX += (-K * spinX - C * velX) * dt;
    }
    spinY += velY * dt;
    spinX += velX * dt;
    spinX = Math.max(-0.62, Math.min(0.62, spinX));

    if (idleDrift) root.rotation.y = spinY + clock.elapsedTime * 0.18;
    else           root.rotation.y = spinY;

    leanX += (leanTX - leanX) * Math.min(1, dt * 5);
    leanY += (leanTY - leanY) * Math.min(1, dt * 5);
    root.rotation.x = spinX + leanX;
    root.rotation.y += leanY;

    if (squash > 0) {
      squash = Math.max(0, squash - dt * 5.2);
      const s = 1 - 0.045 * Math.sin(squash * Math.PI);
      root.scale.set(s, s, s);
    } else if (root.scale.x !== 1) {
      root.scale.set(1, 1, 1);
    }
  }

  renderer.render(scene, camera);

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAcc) + ' fps';
    fpsAcc = 0; fpsFrames = 0;
  }
}
tick();
</script>
</body>
</html>
